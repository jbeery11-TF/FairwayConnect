<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Training Week</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a training logbook. Week strip first (7 day cards), each card carries its session then the meals that follow it. Tabs drill into sessions, meals, groceries, check-in, setup. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#15202b; --muted:#566473; --line:#d6dde4;
  --accent:#2446c4; --accent-soft:#e3e9fb; --meal:#2d7a4c; --meal-soft:#e2f2e8;
  --warn:#9a5b00; --warn-soft:#fbf0dc; --alert:#b0261d; --alert-soft:#fbe6e4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161e27; --surface-2:#1b2530; --ink:#e5eaf0; --muted:#97a4b2; --line:#2a3644;
  --accent:#8ea6ff; --accent-soft:#1f2a4d; --meal:#6cc490; --meal-soft:#173325;
  --warn:#f0b44c; --warn-soft:#3a2c12; --alert:#ff8f85; --alert-soft:#3d1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161e27; --surface-2:#1b2530; --ink:#e5eaf0; --muted:#97a4b2; --line:#2a3644;
  --accent:#8ea6ff; --accent-soft:#1f2a4d; --meal:#6cc490; --meal-soft:#173325;
  --warn:#f0b44c; --warn-soft:#3a2c12; --alert:#ff8f85; --alert-soft:#3d1d1b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:1.7rem}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{text-transform:uppercase}
.brand .wk{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:20px 64px}
.view{display:grid;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px;align-content:start}
.stack>.btn{justify-self:start}
.stack>.btn.primary{justify-self:stretch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.small{padding:4px 9px;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.train{background:var(--accent-soft);color:var(--accent)}
.pill.meal{background:var(--meal-soft);color:var(--meal)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.alert{background:var(--alert-soft);color:var(--alert)}
.pill.plain{background:var(--surface-2);color:var(--muted)}

/* summary stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}

/* flags */
.flags{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 var(--r) var(--r) 0;padding:12px 16px}
.flags.ok{border-left-color:var(--meal);background:var(--meal-soft)}
.flags ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.flags li.see{color:var(--alert);font-weight:500}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}

/* week strip */
.prep{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px}
.week{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:760px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.day.today{border-color:var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 6px}
.day-h .dn{font-family:var(--display);font-size:1.35rem;text-transform:uppercase}
.day-h .dd{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.sess{margin:0 8px;border-radius:8px;padding:10px;background:var(--accent-soft);border:0;text-align:left;cursor:pointer;display:grid;gap:4px;color:var(--ink)}
.sess:hover{outline:1px solid var(--accent)}
.sess .t{font-weight:600;color:var(--accent)}
.sess .m{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.sess ul{margin:2px 0 0;padding-left:16px;font-size:.84rem}
.sess.rest{background:var(--surface-2);cursor:default}
.sess.rest .t{color:var(--muted)}
.sess.rest:hover{outline:0}
.tl{list-style:none;margin:0;padding:10px 12px 12px;display:grid;gap:6px;font-size:.86rem}
.tl li{display:grid;grid-template-columns:4.6em 1fr;gap:6px;align-items:start}
.tl time{font-family:var(--mono);font-size:.74rem;color:var(--muted);padding-top:2px}
.tl .tag{display:block;font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--meal)}
.tl li.s-row .nm{color:var(--accent);font-weight:600}
.dayfoot{margin-top:auto;border-top:1px solid var(--line);padding:8px 12px;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}

/* session detail */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:disabled{opacity:.45;cursor:default}
.cols{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}}
.cols>*{min-width:0}
.phase{display:grid;gap:8px}
.phase-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:4px}
.phase ol,.phase ul.plain{margin:0;padding-left:20px;display:grid;gap:4px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td .cue{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
td.rx{font-family:var(--mono);font-size:.88rem;white-space:nowrap}
td.ez{font-size:.86rem}
.ex-n{font-weight:600}
.idx{font-family:var(--display);font-size:1.3rem;color:var(--accent);width:2em}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:7.5em 1fr 2.4em;gap:8px;align-items:center;font-size:.85rem}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--accent)}
.bar .fill.low{background:var(--warn)}
.bar .num{text-align:right}

/* meals */
.batch{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:760px){.batch{grid-template-columns:1fr 1fr}}
.batch .card h3{color:var(--meal)}
.batch ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.9rem}
.mealtable td{font-size:.88rem}
.mealtable td.dn{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;white-space:nowrap}
.mt{display:grid;gap:3px}
.mt div{display:grid;grid-template-columns:4.8em 1fr;gap:6px}
.mt time{font-family:var(--mono);font-size:.74rem;color:var(--muted);padding-top:2px}
.swaps{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:760px){.swaps{grid-template-columns:1fr 1fr}}
.swap{border-top:1px solid var(--line);padding-top:8px;font-size:.9rem}
.swap b{display:block}

/* groceries */
.aisles{columns:1;column-gap:16px}
@media (min-width:700px){.aisles{columns:2}}
@media (min-width:1100px){.aisles{columns:3}}
.aisle{break-inside:avoid;margin-bottom:16px}
.aisle h3{border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:6px}
.gi{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gi input{margin:0;transform:translateY(2px)}
.gi .q{margin-left:auto;font-family:var(--mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.gi.done span.n{text-decoration:line-through;color:var(--muted)}

/* check-in */
.ck-row{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ck-row .ctl{display:flex;gap:8px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--display);font-size:4rem;line-height:1}
.grade{font-family:var(--display);font-size:1.4rem;text-transform:uppercase}
.change{border-left:4px solid var(--accent);padding:4px 0 4px 12px}
.q-box{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-weight:500}
.seg{justify-self:start;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:5px 11px;cursor:pointer;border-right:1px solid var(--line);font-family:var(--mono)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent);font-weight:600}
.seg label:has(input:checked){background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

/* forms */
.form{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.form{grid-template-columns:1fr 1fr}}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;margin:0;display:grid;gap:10px;min-width:0}
legend{font-family:var(--display);font-weight:700;font-size:1.2rem;padding:0 6px}
.field{display:grid;gap:4px}
.field>span{font-size:.82rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sched{display:grid;grid-template-columns:3.4em 1fr 1fr;gap:6px 8px;align-items:center}
.sched .dn{font-family:var(--display);font-size:1.1rem;text-transform:uppercase}
.copybox{width:100%;min-height:160px;font-family:var(--mono);font-size:.8rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;z-index:20}
@media (prefers-reduced-motion:no-preference){.sess,.btn,.chip{transition:outline-color .15s,border-color .15s,background .15s}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Home Training Week</h1><span class="wk" id="wkLabel"></span></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-v="week" id="t-week">Week</button>
      <button class="tab" role="tab" data-v="sessions" id="t-sessions">Sessions</button>
      <button class="tab" role="tab" data-v="meals" id="t-meals">Meals</button>
      <button class="tab" role="tab" data-v="groceries" id="t-groceries">Groceries</button>
      <button class="tab" role="tab" data-v="checkin" id="t-checkin">Check-in</button>
      <button class="tab" role="tab" data-v="setup" id="t-setup">Setup</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-week"></section>
  <section class="view" id="v-sessions" hidden></section>
  <section class="view" id="v-meals" hidden></section>
  <section class="view" id="v-groceries" hidden></section>
  <section class="view" id="v-checkin" hidden></section>
  <section class="view" id="v-setup" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem("htw."+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("htw."+k,JSON.stringify(v))}catch(e){}}
};
const clone=o=>JSON.parse(JSON.stringify(o));
const DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DFULL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

/* ---------- dates ---------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function defaultMonday(){
  const t=new Date(),x=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow);
  if(dow>=5) x.setDate(x.getDate()+7); // planning on the weekend: start next Monday
  return iso(x);
}
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=(d,o)=>d.toLocaleDateString(undefined,o||{month:"short",day:"numeric"});

/* ---------- defaults ---------- */
const DEFAULTS={
  age:38, weight:180, wunit:"lb", level:"intermediate", goal:"general",
  equipment:{db:true,kb:false,band:true,bar:false,bench:false,mat:true},
  injuries:{knee:false,back:false,shoulder:false,wrist:false}, injuryNotes:"",
  conditions:{heart:false,dizzy:false,bp:false,diabetes:false,pregnant:false,surgery:false,meds:false},
  days:[{min:40,time:"evening"},{min:0,time:"evening"},{min:35,time:"evening"},{min:0,time:"evening"},{min:30,time:"evening"},{min:45,time:"morning"},{min:0,time:"morning"}],
  soreness:"moderate",
  diet:"omnivore", avoid:{dairy:false,gluten:false,nuts:false,eggs:false,fish:false}, avoidText:"",
  cook:"moderate", budget:"moderate", medical:""
};
const EQUIP={db:"Dumbbells",kb:"Kettlebell",band:"Resistance bands",bar:"Pull-up bar",bench:"Bench",mat:"Floor mat"};
const INJ={knee:"Knee",back:"Lower back",shoulder:"Shoulder",wrist:"Wrist"};
const COND={heart:"Heart condition or chest pain with effort",dizzy:"Dizziness or fainting",bp:"High blood pressure",diabetes:"Diabetes",pregnant:"Pregnant or postpartum",surgery:"Joint or back surgery in the last 12 months",meds:"Medication that changes heart rate or blood pressure"};
const AVOID={dairy:"Dairy",gluten:"Gluten",nuts:"Nuts / peanuts",eggs:"Eggs",fish:"Fish & shellfish"};
const TIMES={morning:"Morning",midday:"Midday",evening:"Evening"};

/* ---------- exercise library ---------- */
// eq: every requirement must be met; "db|kb" means either. av: injuries that rule it out. fb: fallback, not used for variety.
const EX=[
 {p:"squat",n:"Goblet squat",eq:["db|kb"],av:["knee"],e:"Goblet squat to a chair: tap the seat and stand",c:"Weight at your chest, elbows inside the knees, sit down between your heels."},
 {p:"squat",n:"Tempo bodyweight squat",eq:[],av:["knee"],e:"Squat to a chair, hands on a counter",c:"3 seconds down, 1 second up. Knees track over your toes."},
 {p:"squat",n:"Box squat to a chair",eq:[],av:[],e:"Sit-to-stand pushing off your thighs",c:"Reach the hips back, touch the seat lightly, stand without rocking. Pain-free range only."},
 {p:"hinge",n:"Dumbbell Romanian deadlift",eq:["db"],av:["back"],e:"Hip hinge with hands on thighs, no weight",c:"Soft knees, push the hips back until the hamstrings stretch, back stays flat."},
 {p:"hinge",n:"Kettlebell deadlift",eq:["kb"],av:["back"],e:"Bell raised on a step to shorten the range",c:"Bell between the feet, hinge, grip, stand tall by driving the floor away."},
 {p:"hinge",n:"Banded good morning",eq:["band"],av:["back"],e:"Wall hinge: push hips back to touch a wall",c:"Band under the feet and over the upper back. Hinge with a flat back."},
 {p:"hinge",n:"Glute bridge",eq:[],av:[],e:"Shorter range, hold 2 seconds at the top",c:"Ribs down, drive through the heels, squeeze the glutes. No low-back arch."},
 {p:"lunge",n:"Dumbbell reverse lunge",eq:["db"],av:["knee"],u:"each",e:"Bodyweight reverse lunge holding a counter",c:"Step back and drop the back knee straight down. Front shin stays close to vertical."},
 {p:"lunge",n:"Split squat",eq:[],av:["knee"],u:"each",e:"Half-depth split squat, one hand on a wall",c:"Long stance, lower straight down, front heel stays planted."},
 {p:"lunge",n:"Single-leg glute bridge",eq:[],av:[],u:"each",e:"Glute bridge with feet close together",c:"One knee hugged in or leg straight, push through the planted heel."},
 {p:"pushH",n:"Dumbbell bench press",eq:["db","bench"],av:["shoulder"],e:"Dumbbell floor press",c:"Shoulder blades pinned, elbows about 45° from your sides."},
 {p:"pushH",n:"Push-up",eq:[],av:["wrist","shoulder"],e:"Incline push-up, hands on a counter",c:"Body in one line, chest to fist height, elbows back at 45°."},
 {p:"pushH",n:"Dumbbell floor press",eq:["db"],av:[],e:"Lighter dumbbells, pause on the floor",c:"Upper arms touch the floor softly, press over the chest. The floor limits range, which is easy on shoulders."},
 {p:"pushH",n:"Band chest press",eq:["band"],av:[],e:"Lighter band, or step closer to the anchor",c:"Anchor behind you at chest height, press straight out, slow return."},
 {p:"pushH",n:"Wall push-up",eq:[],av:[],fb:1,e:"Stand closer to the wall",c:"Hands at shoulder height, lower the chest toward the wall in a straight line."},
 {p:"pushV",n:"Dumbbell overhead press",eq:["db"],av:["shoulder","back"],e:"Seated, one arm at a time",c:"Squeeze the glutes, ribs down, press up and slightly back."},
 {p:"pushV",n:"Pike push-up",eq:[],av:["shoulder","wrist"],e:"Pike push-up with hands on a chair",c:"Hips high, lower the top of your head toward the floor between your hands."},
 {p:"pushV",n:"Band overhead press",eq:["band"],av:["shoulder"],e:"Half-kneeling, one arm",c:"Stand on the band, press overhead, biceps finish by the ear."},
 {p:"pushV",n:"Wall slide",eq:[],av:[],fb:1,e:"Smaller range, stop below any pinch",c:"Back and forearms on the wall, slide up while keeping contact."},
 {p:"pullH",n:"One-arm dumbbell row",eq:["db"],av:[],u:"each",e:"Lighter dumbbell, chest supported on an incline",c:"Hand on a chair seat, pull the elbow to your hip, pause one second."},

function has(s,k){return k==="bw"||!!s.equipment[k]}
function eligible(p,s){return EX.filter(e=>e.p===p&&e.eq.every(r=>r.split("|").some(k=>has(s,k)))&&!e.av.some(a=>s.injuries[a]))}
function pick(p,s,variant,dayIdx){
  const list=eligible(p,s); if(!list.length) return null;
  if(p==="core") return list[dayIdx%list.length];
  if(variant&&list[1]&&!list[1].fb) return list[1];
  return list[0];
}
const LV={beginner:{sets:2,reps:"10–12",rest:60,sec:"20–30 s"},intermediate:{sets:3,reps:"8–12",rest:75,sec:"30–40 s"},advanced:{sets:4,reps:"6–10",rest:90,sec:"40–45 s"}};
function rx(e,s){
  const L=LV[s.level]; let sets=L.sets,reps=L.reps,rest=L.rest,per=0.75;
  if(e.u==="rounds"){const r={beginner:[6,20,40],intermediate:[8,30,30],advanced:[10,30,30]}[s.level];
    return {sets:r[0],reps:`${r[1]} s on / ${r[2]} s off`,rest:0,unit:"rounds",min:r[0]*(r[1]+r[2])/60};}
  if(s.goal==="strength"){reps={beginner:"8–10",intermediate:"6–8",advanced:"4–6"}[s.level];rest+=30}
  if(s.goal==="fatloss"){reps="12–15";rest=Math.max(45,rest-15)}
  if(s.soreness==="high") sets=Math.max(2,sets-1);
  if(e.u==="each"){reps+=" each side";per=1.4}
  if(e.u==="sec"){reps=L.sec;rest=45}
  if(e.u==="secEach"){reps=L.sec+" each side";rest=45;per=1.2}
  if(e.u==="dist"){reps="30–40 m each hand";rest=45;per=1.2}
  if(e.p==="core"||e.p==="carry"){rest=45;sets=Math.min(sets,3)}
  return {sets,reps,rest,unit:"sets",min:sets*(per+rest/60)};
}

function warmup(f,s){
  const w=[{n:s.injuries.knee?"March in place":"Step jacks or easy jog in place",d:"1 min"},{n:"Cat-cow",d:"6 slow reps"}];
  if(f==="lower"||f==="full") w.push({n:"Bodyweight good morning",d:"10 reps"},{n:"Glute bridge",d:"10 reps"});
  if(f==="upper"||f==="full") w.push(s.equipment.band?{n:"Band pull-apart",d:"15 reps"}:{n:"Arm circles",d:"10 each way"},{n:"Wall slide",d:"8 reps"});
  w.push({n:"Ramp-up set of the first exercise",d:"8 reps at half weight"});
  return w;
}
function cooldown(f,s){
  const L=[{n:"Kneeling hip flexor stretch",d:"30 s each side"},{n:"Standing hamstring stretch",d:"30 s each side"},{n:"Figure-4 glute stretch",d:"30 s each side"}];
  const U=[{n:"Doorway chest stretch",d:"30 s each side"},{n:s.injuries.knee?"Lat stretch on a counter":"Child's pose with side reach",d:"45 s"},{n:"Open-book rotation",d:"5 each side"}];
  let c=f==="lower"?L:f==="upper"?U:[L[0],L[1],U[0]];
  return c.concat([{n:"Slow breathing, 4 s in / 6 s out",d:"1 min"}]);
}
function buildSession(key,min,s,variant,dayIdx){
  const t=TPL[key];
  if(key==="AR") return {key,name:t.n,focus:t.f,min,est:min,items:[],warm:[{n:"Brisk walk outside or on the stairs",d:`${Math.max(15,min-10)} min`}],cool:[{n:"Full-body mobility flow",d:"8 min"}].concat(cooldown("full",s)),circuit:false};
  const warmMin=5,coolMin=4,avail=min-warmMin-coolMin,circuit=min<=25;
  const items=[];let used=0;
  t.p.forEach(p=>{
    const e=pick(p,s,variant,dayIdx); if(!e||items.some(i=>i.e===e)) return;
    const r=rx(e,s); const cost=circuit?1:r.min;
    if(items.length>=3&&used+cost>avail) return;
    items.push({e,r});used+=cost;
  });
  let rounds=0;
  if(circuit){
    const list=items.filter(i=>i.e.p!=="cond").slice(0,4); items.length=0; items.push(...list);
    const roundMin=list.length*0.9+1.5;
    rounds=Math.max(2,Math.min(LV[s.level].sets+1,Math.floor(avail/roundMin)));
    used=rounds*roundMin;
  }
  return {key,name:t.n,focus:t.f,min,est:Math.round(warmMin+coolMin+used),items,warm:warmup(t.f,s),cool:cooldown(t.f,s),circuit,rounds};
}

function mealOK(m,s){
  if(s.diet==="vegetarian"&&(m.has.includes("meat")||m.has.includes("fish"))) return false;
  if(s.diet==="pescatarian"&&m.has.includes("meat")) return false;
  if(Object.keys(s.avoid).some(k=>s.avoid[k]&&m.has.includes(k))) return false;
  const words=(s.avoidText||"").toLowerCase().split(/[,;\n]/).map(w=>w.trim()).filter(w=>w.length>2);
  if(words.some(w=>m.n.toLowerCase().includes(w)||m.ing.some(i=>i[0].toLowerCase().includes(w)))) return false;
  return true;
}
function pool(slot,s){
  const wc={tight:4,moderate:1.5,flexible:0}[s.budget],wp={quick:0.35,moderate:0.12,enjoy:0}[s.cook];
  const all=MEALS.filter(m=>m.slot===slot);
  let ok=all.filter(m=>mealOK(m,s));
  const rank=(m,i)=>m.cost*wc+m.prep*wp-m.pro*0.05+i*0.01;
  ok=ok.map((m,i)=>({m,v:rank(m,i)})).sort((a,b)=>a.v-b.v).map(x=>x.m);
  return ok;
}

  } else trainIdx.forEach((i,k)=>tplByDay[i]=split[k]);
  const seen={};
  const days=s.days.map((d,i)=>{
    const key=tplByDay[i];
    let session=null;
    if(key){const v=seen[key]||0;seen[key]=v+1;session=buildSession(key,d.min,s,v%2===1,i)}
    return {i,min:d.min,time:d.time,session};
  });

  // meals
  const L=pool("l",s),D=pool("d",s),B=pool("b",s),P=pool("pre",s),Q=pool("post",s),S=pool("snack",s);
  const pickN=(arr,n,fb)=>{const out=[];for(let k=0;k<n;k++) out.push(arr.length?arr[k%arr.length]:fb);return out};
  const dBatch=D.filter(m=>!m.fresh).concat(D.filter(m=>m.fresh));
  const [lA,lB]=pickN(L,2,null), [dA,dB]=pickN(dBatch,2,null);
  const restL=L.filter(m=>m!==lA&&m!==lB),restD=D.filter(m=>m!==dA&&m!==dB);
  const lC=(restL.slice().sort((a,b)=>a.prep-b.prep)[0])||lA;
  const dC=(restD.find(m=>m.fresh)||restD[0])||dA;
  const b2=[2,1,3].find(i=>!days[i].session)??2; // second batch on a rest day mid-week
  const brk=pickN(B,2,null), pre=P.length?P:[null], post=Q.length?Q:[null], snk=S.length?S:[null];
  let tr=0,rs=0;
  days.forEach(day=>{
    const isT=day.session&&day.session.key!=="AR";
    const sched=isT?SCHED[day.time]:SCHED.rest;
    const batch=day.i<=b2?1:2;
    const lunch=day.i===6?lC:batch===1?lA:lB, dinner=day.i===6?dC:batch===1?dA:dB;
    const bf=isT&&day.time==="morning"?brk.slice().sort((a,b)=>(b?.pro||0)-(a?.pro||0))[0]:brk[day.i%2];
    day.meals=sched.map(([slot,t,tag])=>{
      if(slot==="session") return {slot,t};
      let m=null,src="";
      if(slot==="b"){m=bf;src=m&&m.batchJar?"prepped jar":""}
      if(slot==="l"){m=lunch;src=day.i===6?"cook fresh":`batch ${batch}`}
      if(slot==="d"){m=dinner;src=day.i===6?"cook fresh":`batch ${batch}`}
      if(slot==="pre") m=pre[tr%pre.length];
      if(slot==="snack"){m=isT?post[tr%post.length]:snk[rs%snk.length]}
      return {slot,t,m,tag,src};
    });
    if(isT) tr++; else rs++;
    day.batch2=day.i===b2;
    day.pro=day.meals.reduce((a,x)=>a+(x.m?.pro||0),0);
    day.kcal=day.meals.reduce((a,x)=>a+(x.m?.kcal||0),0);
  });
  const count=(id)=>days.reduce((a,d)=>a+d.meals.filter(x=>x.m&&x.m.id===id&&x.src&&x.src.startsWith("batch")).length,0);
  const jars=(from,to)=>days.filter(d=>d.i>=from&&d.i<=to).reduce((a,d)=>a+d.meals.filter(x=>x.m&&x.m.batchJar).length,0);
  const batches=[
    {n:1,day:"Sunday before",cover:`Mon–${DN[b2]}`,recipes:[lA,dA].filter(Boolean).map(m=>({m,q:Math.min(count(m.id),b2+1)})),jars:jars(0,b2)},
    {n:2,day:`${DFULL[b2]} evening`,cover:`${DN[b2+1]}–Sat`,recipes:[lB,dB].filter(Boolean).map(m=>({m,q:5-b2})),jars:jars(b2+1,5)}
  ];
  if(lA===lB) batches[0].recipes[0].q=b2+1;
  return {days,batches,b2,missing:{l:!L.length,d:!D.length,b:!B.length}};
}

/* ---------- groceries ---------- */
function groceries(plan){
  const map={};
  plan.days.forEach(d=>d.meals.forEach(x=>{if(!x.m) return; x.m.ing.forEach(([n,q,u,a])=>{const k=n+"|"+u; (map[k]=map[k]||{n,u,a:A[a],q:0}).q+=q})}));
  const by={};
  Object.values(map).forEach(it=>{(by[it.a]=by[it.a]||[]).push(it)});
  const order=Object.values(A);
  return order.filter(a=>by[a]).map(a=>({a,items:by[a].sort((x,y)=>x.n.localeCompare(y.n))}));
}
function qty(it){
  const q=it.q;
  if(it.u==="g"){const r=Math.ceil(q/25)*25; return r>=1000?(r/1000).toFixed(r%1000?2:0).replace(/0$/,"")+" kg":r+" g"}
  if(it.u==="ml"){const r=Math.ceil(q/50)*50; return r>=1000?(r/1000).toFixed(1).replace(/\.0$/,"")+" L":r+" ml"}
  if(it.u==="can") {const c=Math.ceil(q-0.05);return c+(c===1?" can":" cans")}
  if(it.u==="jar") return Math.ceil(q)+" jar";
  if(it.u==="tbsp"||it.u==="tsp") return "pantry · "+(Math.round(q*10)/10)+" "+it.u;
  if(it.u==="scoop") return Math.ceil(q)+" scoops";
  if(it.u==="slice") return Math.ceil(q)+" slices";
  return String(Math.ceil(q-0.05));
}

/* ---------- doctor flags ---------- */
function flags(s){
  const f=[];
  if(s.conditions.heart) f.push(["see","Heart condition or chest pain with effort: get medical clearance before any session in this plan."]);
  if(s.conditions.dizzy) f.push(["see","Dizziness or fainting: get it checked before training. Stop any session if it happens."]);
  if(s.conditions.bp) f.push(["check","High blood pressure: ask your doctor about safe effort levels, and breathe out on every rep instead of holding your breath."]);
  if(s.conditions.meds) f.push(["check","Heart-rate or blood-pressure medication: heart-rate zones may not apply. Use the reps-in-the-tank rule and ask your doctor about limits."]);
  if(s.conditions.diabetes) f.push(["check","Diabetes: confirm carb timing around sessions and whether to check glucose before training. Keep fast carbs nearby."]);
  if(s.conditions.pregnant) f.push(["see","Pregnant or postpartum: ask your doctor or midwife which exercises and positions to avoid, and when to resume core work."]);
  if(s.conditions.surgery) f.push(["see","Surgery in the last 12 months: get your surgeon's or physio's loading limits before you start."]);
  if(s.injuries.knee) f.push(["check","Knee: squats and lunges are swapped for pain-free versions. See a doctor or physio if it swells, locks or gives way."]);
  if(s.injuries.back) f.push(["check","Lower back: hinges are swapped for bridges. See a doctor if pain travels down the leg or you notice numbness or weakness."]);
  if(s.injuries.shoulder) f.push(["check","Shoulder: overhead and push-up moves are swapped. Get it checked if you have night pain or can't lift the arm."]);
  if(s.injuries.wrist) f.push(["check","Wrist: push-ups are swapped for dumbbell or band presses. Get it checked if pain stays sharp after a week."]);
  if(s.injuryNotes.trim()) f.push(["check",`Your injury note (“${s.injuryNotes.trim()}”): run it past a doctor or physio before loading that area.`]);
  if(s.age>=45&&s.level==="beginner") f.push(["check","New to training and 45 or older: a check-up before starting harder exercise is a sensible first step."]);
  if(s.medical.trim()) f.push(["check",`Medical diet (“${s.medical.trim()}”): confirm the meal plan, the protein target and any supplements with your doctor or a registered dietitian.`]);
  return f;
}
function proteinTarget(s){
  const kg=s.wunit==="kg"?s.weight:s.weight/2.2046;
  return [Math.round(kg*1.6/5)*5,Math.round(kg*2.2/5)*5];
}

  const sessPts=td.length?Math.round(done/td.length*45):45;
  const mealPts=Math.round(CK.meals/100*20);
  const sl=Number(CK.sleep)||0, sleepPts=sl>=7.5?15:sl>=7?12:sl>=6.5?9:sl>=6?6:3;
  const enPts=Math.round(CK.energy/5*20);
  const score=sessPts+mealPts+sleepPts+enPts;
  const grade=score>=85?"Strong week":score>=70?"Solid week":score>=50?"Mixed week":"Reset week";
  const cnt=k=>skips.filter(x=>x===k).length;
  const N=clone(S); let change,why,question;
  if(cnt("pain")){
    change="Use the simpler version of every move that hurt, and drop one set from each exercise.";
    why=`You skipped or cut ${cnt("pain")} session${cnt("pain")>1?"s":""} because of soreness or pain.`;
    N.soreness="high";
    question="Which exact movement caused pain, and was it a dull muscle ache or a sharp joint pain? Sharp pain that lasts more than a week is a reason to see a doctor or physio.";
  } else if(cnt("time")){
    const cut=td.filter(d=>["skipped","partial"].includes(ckDay(d.i).status)&&ckDay(d.i).reason==="time");
    cut.forEach(d=>N.days[d.i].min=Math.max(20,d.min-10));
    change=`Cut ${cut.map(d=>DN[d.i]).join(" and ")} by 10 minutes so the session fits the day you actually have.`;
    why=`Time was the reason for ${cnt("time")} missed session${cnt("time")>1?"s":""}. A shorter session you finish beats a long one you skip.`;
    question="What time of day did those sessions get squeezed out, and is there a slot that is protected more often?";
  } else if(cnt("schedule")){
    const sk=td.filter(d=>ckDay(d.i).reason==="schedule");
    sk.forEach(d=>N.days[d.i].time=d.time==="evening"?"morning":"evening");
    change=`Move ${sk.map(d=>DN[d.i]).join(" and ")} to ${sk[0].time==="evening"?"the morning":"the evening"}, before the day can change.`;
    why="Schedule changes took out sessions. Training at a different time removes the clash.";
    question="Which commitments moved last week, and are they likely to move again?";
  } else if(sl<6.5){
    change="Lights out 30 minutes earlier on the night before each training day.";
    why=`You averaged ${sl} hours of sleep. Recovery and appetite both suffer under 7.`;
    N.soreness=S.soreness==="low"?"moderate":S.soreness;
    question="What pushed bedtime later on the short nights, and which one thing can you move?";
  } else if(CK.energy<=2&&CK.meals<60){
    change="Keep the pre-workout snack on every training day and do both batch cooks, even short versions.";
    why="Energy was low and fewer than 60% of meals went to plan. Under-eating before sessions is the likely link.";
    question="Which meal did you skip most often, and what got in the way?";
  } else if(cnt("motivation")||cnt("energy")){
    change="Put each session in your calendar with the start time, and lay out your gear the night before.";
    why="Skips came from energy or motivation rather than time. Lowering the start-up effort helps most.";
    question="What would make the hardest session of the week 10% easier to start?";
  } else if(answered&&done>=td.length&&CK.energy>=3){
    change="Progress: add 2–5 lb (1–2 kg) or 1–2 reps to the first exercise of each session.";
    why="You finished every session with decent energy. Time to add a little load.";
    N.soreness="low";
    question="Which exercise felt easiest at the top of the rep range? That one gets the extra weight first.";
  } else {
    change="Keep the plan as it is and log each session the day you do it.";
    why=answered?"No single pattern stood out in the skips.":"Mark each session above to get a specific change.";
    question="What was the one moment last week when the plan felt hardest to follow?";
  }
  return {score,grade,parts:[["Sessions",sessPts,45],["Meals",mealPts,20],["Sleep",sleepPts,15],["Energy",enPts,20]],change,why,question,next:N,answered,total:td.length};
}
function renderCheckin(){
  const td=PLAN.days.filter(d=>d.session),sun=addDays(parseIso(weekStart),6);
  let h=`<div class="row between"><div><h2>Weekly check-in</h2><p class="muted">Fill it in on Sunday ${fmt(sun)}. It scores the week and sets up next week's plan.</p></div></div>`;
  h+=`<div class="cols"><div class="card stack"><span class="label">Sessions</span>
    ${td.length?td.map(d=>{const c=ckDay(d.i);return `<div class="ck-row"><b class="mono">${DN[d.i]}</b><div class="ctl">
      <select id="ck-s-${d.i}" data-ck="status" data-i="${d.i}" aria-label="${DFULL[d.i]} ${esc(d.session.name)} status"><option value="">${esc(d.session.name)}: how did it go?</option>
        <option value="done" ${c.status==="done"?"selected":""}>Done</option><option value="partial" ${c.status==="partial"?"selected":""}>Partly done</option><option value="skipped" ${c.status==="skipped"?"selected":""}>Skipped</option></select>
      ${c.status==="skipped"||c.status==="partial"?`<select id="ck-r-${d.i}" data-ck="reason" data-i="${d.i}" aria-label="Reason"><option value="">Why?</option>${Object.entries(REASONS).map(([k,v])=>`<option value="${k}" ${c.reason===k?"selected":""}>${v}</option>`).join("")}</select>`:""}
    </div></div>`}).join(""):`<p class="muted">No sessions this week.</p>`}
    <div class="grid2" style="margin-top:6px">
      <div class="field"><span>Energy, 1 (drained) to 5 (great)</span><div class="seg" role="radiogroup" aria-label="Energy">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="energy" id="ck-e-${n}" value="${n}" data-ck="energy" ${Number(CK.energy)===n?"checked":""}><span>${n}</span></label>`).join("")}</div></div>
      <label class="field"><span>Average sleep (hours)</span><input type="number" id="ck-sleep" step="0.5" min="3" max="12" value="${esc(CK.sleep)}" data-ck="sleep"></label>
      <label class="field"><span>Meals that went to plan: <b id="mealsPct">${CK.meals}%</b></span><input type="range" id="ck-meals" min="0" max="100" step="10" value="${CK.meals}" data-ck="meals"></label>
    </div>
    <label class="field"><span>Notes on how the meals went</span><textarea id="ck-notes" data-ck="notes" placeholder="e.g. Thursday lunch went uneaten, oats were too sweet">${esc(CK.notes)}</textarea></label>
  </div><div id="ckResult" class="stack"></div></div>`;
  h+=promptBar("checkin");
  $("#v-checkin").innerHTML=h;
  renderCkResult();
}
function renderCkResult(){
  const r=evaluate();
  const nextPlan=buildPlan(r.next);
  const rows=PLAN.days.map((d,i)=>{const n=nextPlan.days[i];
    const a=d.session?`${d.session.name}, ${d.min} min ${d.time}`:"Rest",b=n.session?`${n.session.name}, ${n.min} min ${n.time}`:"Rest";
    const sa=d.session?.items[0]?.r.sets,sb=n.session?.items[0]?.r.sets;
    const changed=a!==b||sa!==sb;
    return `<tr><td class="mono">${DN[i]}</td><td>${esc(b)}${n.session&&!n.session.circuit&&n.session.items[0]?` <span class="muted">· ${sb} sets</span>`:""}</td><td>${changed?`<span class="pill warn">changed</span>`:""}</td></tr>`}).join("");
  $("#ckResult").innerHTML=`<div class="card stack"><span class="label">Score · ${r.answered} of ${r.total} sessions logged</span>
      <div class="score"><b class="num">${r.score}</b><span class="muted">/ 100</span></div><div class="grade">${r.grade}</div>
      <div class="bars">${r.parts.map(([n,v,m])=>`<div class="bar"><span>${n}</span><span class="track"><span class="fill" style="width:${Math.round(v/m*100)}%;display:block"></span></span><span class="num">${v}/${m}</span></div>`).join("")}</div></div>
    <div class="card stack"><span class="label">One change for next week</span><p class="change"><b>${esc(r.change)}</b><br><span class="muted">${esc(r.why)}</span></p></div>
    <div class="card stack"><span class="label">Adjusted plan, week of ${fmt(addDays(parseIso(weekStart),7))}</span>
      <div class="tablewrap"><table><tbody>${rows}</tbody></table></div>
      <button class="btn primary" id="startNext">Start next week with this plan</button>
      <p class="muted" style="font-size:.84rem">Saves this week's score, applies the change, clears the check-in and moves the calendar forward.</p></div>
    <div class="card stack"><span class="label">Answer before next Sunday</span><p class="q-box">${esc(r.question)}</p></div>
    ${history.length?`<div class="card stack"><span class="label">Past weeks</span>${history.slice(-6).reverse().map(x=>`<div class="row between"><span class="mono">${esc(x.week)}</span><span><b class="num">${x.score}</b> <span class="muted">· ${esc(x.change)}</span></span></div>`).join("")}</div>`:""}`;
}

/* ---------- setup ---------- */
function opt(v,cur,label){return `<option value="${v}" ${String(cur)===String(v)?"selected":""}>${label}</option>`}
function renderSetup(){
  const mins=[0,15,20,25,30,35,40,45,50,60,75,90];
  $("#v-setup").innerHTML=`<div class="row between"><div><h2>Setup</h2><p class="muted">Everything rebuilds as you change it. Saved in this browser only.</p></div><button class="btn" id="resetEx">Reset to example</button></div>
  <div class="form">
    <fieldset><legend>You</legend>
      <div class="grid2">
        <label class="field"><span>Age</span><input type="number" id="f-age" data-path="age" min="14" max="99" value="${S.age}"></label>
        <label class="field"><span>Body weight</span><input type="number" id="f-weight" data-path="weight" min="30" max="400" value="${S.weight}"></label>
        <label class="field"><span>Unit</span><select id="f-wunit" data-path="wunit">${opt("lb",S.wunit,"lb")}${opt("kg",S.wunit,"kg")}</select></label>
        <label class="field"><span>Fitness level</span><select id="f-level" data-path="level">${opt("beginner",S.level,"Beginner: under 6 months")}${opt("intermediate",S.level,"Intermediate: 6 months to 2 years")}${opt("advanced",S.level,"Advanced: 2+ years")}</select></label>
        <label class="field"><span>Main goal</span><select id="f-goal" data-path="goal">${opt("general",S.goal,"General fitness")}${opt("strength",S.goal,"Get stronger")}${opt("fatloss",S.goal,"Lose fat")}</select></label>
        <label class="field"><span>Soreness last week</span><select id="f-sore" data-path="soreness">${opt("low",S.soreness,"Barely sore")}${opt("moderate",S.soreness,"Normal soreness")}${opt("high",S.soreness,"Very sore or stiff")}</select></label>
      </div>
    </fieldset>
    <fieldset><legend>Equipment at home</legend>
      <div class="checks">${Object.entries(EQUIP).map(([k,v])=>`<label><input type="checkbox" id="f-eq-${k}" data-path="equipment.${k}" ${S.equipment[k]?"checked":""}>${v}</label>`).join("")}</div>
      <p class="muted" style="font-size:.84rem">Bodyweight moves are always included.</p>
    </fieldset>
    <fieldset><legend>Schedule</legend>
      <div class="sched"><span class="label">Day</span><span class="label">Minutes free</span><span class="label">Time</span>
      ${S.days.map((d,i)=>`<span class="dn">${DN[i]}</span><select id="f-min-${i}" data-path="days.${i}.min" aria-label="${DFULL[i]} minutes">${mins.map(m=>opt(m,d.min,m?m+" min":"Rest")).join("")}</select><select id="f-time-${i}" data-path="days.${i}.time" aria-label="${DFULL[i]} time">${Object.entries(TIMES).map(([k,v])=>opt(k,d.time,v)).join("")}</select>`).join("")}</div>
      <p class="muted" style="font-size:.84rem">Days under 15 minutes count as rest. 25 minutes or less becomes a circuit.</p>
    </fieldset>
    <fieldset><legend>Injuries & health</legend>
      <span class="label">Injuries to work around</span>
      <div class="checks">${Object.entries(INJ).map(([k,v])=>`<label><input type="checkbox" id="f-inj-${k}" data-path="injuries.${k}" ${S.injuries[k]?"checked":""}>${v}</label>`).join("")}</div>
      <label class="field"><span>Anything else (old injuries, pain)</span><input type="text" id="f-injn" data-path="injuryNotes" value="${esc(S.injuryNotes)}" placeholder="e.g. tennis elbow, right side"></label>
      <span class="label">Health conditions</span>
      <div class="checks" style="display:grid;gap:6px">${Object.entries(COND).map(([k,v])=>`<label><input type="checkbox" id="f-c-${k}" data-path="conditions.${k}" ${S.conditions[k]?"checked":""}>${v}</label>`).join("")}</div>
    </fieldset>
    <fieldset><legend>Food</legend>
      <div class="grid2">
        <label class="field"><span>How you eat</span><select id="f-diet" data-path="diet">${opt("omnivore",S.diet,"Everything")}${opt("pescatarian",S.diet,"Pescatarian")}${opt("vegetarian",S.diet,"Vegetarian")}</select></label>
        <label class="field"><span>Cooking time</span><select id="f-cook" data-path="cook">${opt("quick",S.cook,"As little as possible")}${opt("moderate",S.cook,"Two batch cooks are fine")}${opt("enjoy",S.cook,"I like cooking")}</select></label>
        <label class="field"><span>Budget</span><select id="f-budget" data-path="budget">${opt("tight",S.budget,"Tight")}${opt("moderate",S.budget,"Moderate")}${opt("flexible",S.budget,"Flexible")}</select></label>
      </div>
      <span class="label">Foods I avoid</span>
      <div class="checks">${Object.entries(AVOID).map(([k,v])=>`<label><input type="checkbox" id="f-av-${k}" data-path="avoid.${k}" ${S.avoid[k]?"checked":""}>${v}</label>`).join("")}</div>
      <label class="field"><span>Other foods to skip, comma separated</span><input type="text" id="f-avt" data-path="avoidText" value="${esc(S.avoidText)}" placeholder="e.g. salmon, coconut, beef"></label>
      <label class="field"><span>Medical diet, if any</span><input type="text" id="f-med" data-path="medical" value="${esc(S.medical)}" placeholder="e.g. low sodium, kidney diet, type 2 diabetes"></label>
    </fieldset>
  </div>`;
}
function setPath(path,val){const ks=path.split(".");let o=S;for(let k=0;k<ks.length-1;k++) o=o[ks[k]];o[ks.at(-1)]=val}

/* ---------- prompts for Claude ---------- */
function details(){
  const eq=Object.keys(EQUIP).filter(k=>S.equipment[k]).map(k=>EQUIP[k].toLowerCase()).join(", ")||"bodyweight only";
  const sched=S.days.map((d,i)=>`${DN[i]} ${d.min>=15?d.min+" min ("+d.time+")":"rest"}`).join(", ");
  const inj=Object.keys(INJ).filter(k=>S.injuries[k]).map(k=>INJ[k].toLowerCase()).concat(S.injuryNotes.trim()?[S.injuryNotes.trim()]:[]).join(", ")||"none";
  const cond=Object.keys(COND).filter(k=>S.conditions[k]).map(k=>COND[k].toLowerCase()).join("; ")||"none";
  const av=Object.keys(AVOID).filter(k=>S.avoid[k]).map(k=>AVOID[k].toLowerCase()).concat(S.avoidText.trim()?[S.avoidText.trim()]:[]).join(", ")||"none";
  return {eq,sched,inj,cond,av};
}
function promptText(kind){
  const d=details();
  if(kind==="system") return `Act as a strength coach and nutrition planner. Build a weekly training and eating system I can run at home. Analyze my equipment, my schedule, my fitness level, and any injuries. Design the session plan, each workout with sets and rest, the daily meal structure, a grocery list, and a weekly check-in. Flag anything I should check with my doctor first.

My equipment: ${d.eq}.
My schedule: ${d.sched}.
My fitness level: ${S.level}. Goal: ${S.goal==="fatloss"?"fat loss":S.goal}. Age ${S.age}, ${S.weight} ${S.wunit}.
Injuries: ${d.inj}. Health conditions: ${d.cond}.
Food: ${S.diet}; avoid ${d.av}; medical diet: ${S.medical.trim()||"none"}.`;
  if(kind==="session"){
    const groups=["legs (quads, glutes, hamstrings)","chest","shoulders","back","arms","core"].join(", ");
    return `Act as a personal trainer for home workouts. Write this week's sessions in detail. Analyze my equipment, my available minutes per day, the muscle groups to cover, and how sore I was last week. Design each session with a warm-up, the main exercises with sets, reps and rest, a simpler version of each move, and a cooldown. Paste to Claude: my equipment is ${d.eq}.

Minutes per day: ${d.sched}.
Muscle groups to cover: ${groups}.
Soreness last week: ${S.soreness}. Level: ${S.level}. Injuries: ${d.inj}.`;}
  if(kind==="meal") return `Act as a meal planner for busy people who train. Build my week of meals around my sessions. Analyze my food preferences, my cooking time, my budget, and the foods I avoid. Design a full weekly meal plan, prep steps for two batch-cooking sessions, a grocery list sorted by store aisle, and swaps for meals I skip. If I mention a medical diet, note what to confirm with my doctor.

My sessions: ${PLAN.days.map((x,i)=>`${DN[i]} ${x.session?x.session.name+" "+x.min+" min "+x.time:"rest"}`).join(", ")}.
Food preferences: ${S.diet}. Cooking time: ${({quick:"as little as possible",moderate:"two batch cooks a week",enjoy:"I enjoy cooking"})[S.cook]}. Budget: ${S.budget}.
Foods I avoid: ${d.av}. Medical diet: ${S.medical.trim()||"none"}. Body weight ${S.weight} ${S.wunit}.`;
  const td=PLAN.days.filter(x=>x.session);
  const done=td.filter(x=>ckDay(x.i).status==="done").map(x=>DN[x.i]+" "+x.session.name).join(", ")||"none";
  const sk=td.filter(x=>["skipped","partial"].includes(ckDay(x.i).status)).map(x=>`${DN[x.i]} ${x.session.name} (${ckDay(x.i).status}${ckDay(x.i).reason?", "+REASONS[ckDay(x.i).reason].toLowerCase():""})`).join(", ")||"none";
  return `Act as an accountability coach. Run my weekly check-in on the plan. Analyze the sessions I completed, the ones I skipped and why, my energy, my sleep, and how the meals went. Design a short score for the week, the one change to make next week, an adjusted session plan, and a question to answer before next Sunday.

Sessions completed: ${done}.
Skipped or cut short: ${sk}.
Energy: ${CK.energy}/5. Sleep: ${CK.sleep} hours a night on average.
Meals: about ${CK.meals}% went to plan. ${CK.notes.trim()?"Notes: "+CK.notes.trim():""}`;
}
const PNAME={system:"Home Training System",session:"Session Builder",meal:"Meal and Grocery Plan",checkin:"Weekly Check-In"};
function promptBar(kind){return `<div class="card row between"><div><span class="label">Ask Claude for more</span><p>Copy the <b>${PNAME[kind]}</b> prompt with your details filled in.</p></div><button class="btn" data-copy="${kind}">Copy prompt</button><textarea class="copybox" id="cb-${kind}" readonly hidden></textarea></div>`}

/* ---------- utilities ---------- */
let tt;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800)}
function copy(text,fallbackId){
  const show=()=>{if(!fallbackId) return;const ta=document.getElementById(fallbackId);ta.value=text;ta.hidden=false;ta.focus();ta.select();toast("Select all and copy")};
  try{navigator.clipboard.writeText(text).then(()=>toast("Copied"),show)}catch(e){show()}
}
function renderAll(){
  PLAN=buildPlan(S);
  const dates=weekDates();
  $("#wkLabel").textContent=`${fmt(dates[0])} – ${fmt(dates[6])}`;
  renderWeek();renderSessions();renderMeals();renderGroceries();renderCheckin();
}
const VIEWS=["week","sessions","meals","groceries","checkin","setup"];
function show(v){
  if(!VIEWS.includes(v)) v="week";
  ui.view=v;
  VIEWS.forEach(x=>{$("#v-"+x).hidden=x!==v;$("#t-"+x).setAttribute("aria-selected",x===v)});
  try{store.set("view",v)}catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-g]");if(!t) return;
  if(t.dataset.v){show(t.dataset.v);window.scrollTo(0,0);return}
  if(t.dataset.go){show(t.dataset.go);window.scrollTo(0,0);return}
  if(t.dataset.day){ui.day=Number(t.dataset.day);renderSessions();show("sessions");window.scrollTo(0,0);return}
  if(t.dataset.sday){ui.day=Number(t.dataset.sday);renderSessions();return}
  if(t.dataset.copy){copy(promptText(t.dataset.copy),"cb-"+t.dataset.copy);return}
  if(t.id==="dismiss"){store.set("dismissed",true);renderWeek();return}
  if(t.id==="copyList"){copy(listText(),null);return}
  if(t.id==="clearList"){GC={};save();renderGroceries();return}
  if(t.id==="resetEx"){S=clone(DEFAULTS);save();renderSetup();renderAll();toast("Example setup restored");return}
  if(t.id==="startNext"){
    const r=evaluate();
    history.push({week:fmt(parseIso(weekStart)),score:r.score,change:r.change});
    S=r.next; weekStart=iso(addDays(parseIso(weekStart),7)); CK={days:{},energy:3,sleep:7,meals:70,notes:""}; GC={};
    save();renderSetup();renderAll();show("week");window.scrollTo(0,0);toast("Next week is ready");return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.g!==undefined){GC[t.dataset.g]=t.checked;save();t.closest(".gi").classList.toggle("done",t.checked);
    const g=groceries(PLAN),total=g.reduce((a,x)=>a+x.items.length,0),done=g.reduce((a,x)=>a+x.items.filter(it=>GC[it.n]).length,0);
    const p=$("#v-groceries .muted");if(p) p.textContent=`Sorted by store aisle for one person, Monday to Sunday. ${done} of ${total} in the cart.`;return}
  if(t.dataset.ck==="status"||t.dataset.ck==="reason"){
    const i=t.dataset.i,c=Object.assign({status:"",reason:""},CK.days[i]);c[t.dataset.ck]=t.value;if(c.status==="done"||!c.status) c.reason="";CK.days[i]=c;save();
    const id=t.id;renderCheckin();const el=document.getElementById(id);if(el) el.focus();return}
  if(t.dataset.path) onSetup(t);
  if(t.dataset.ck) onCk(t);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.path&&(t.type==="text"||t.type==="number")) onSetup(t);
  if(t.dataset.ck&&["sleep","meals","notes"].includes(t.dataset.ck)) onCk(t);
});
function onSetup(t){
  let v=t.type==="checkbox"?t.checked:t.value;
  if(t.type==="number"||/\.min$/.test(t.dataset.path)) v=Number(v)||0;
  setPath(t.dataset.path,v);save();renderAll();
}
function onCk(t){
  const k=t.dataset.ck;
  if(k==="energy") CK.energy=Number(t.value);
  if(k==="sleep") CK.sleep=Number(t.value)||0;
  if(k==="meals"){CK.meals=Number(t.value);$("#mealsPct").textContent=CK.meals+"%"}
  if(k==="notes") CK.notes=t.value;
  save();renderCkResult();
}

/* ---------- boot ---------- */
renderSetup();renderAll();
const h=(location.hash||"").slice(1);
show(VIEWS.includes(h)?h:"week");
})();
</script>
