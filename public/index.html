<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a6e3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FairwayConnect" />
  <title>FairwayConnect — The professional network for golfers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
</head>
<body class="noauth">
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="#/feed">
        <img class="brand-logo" src="logo-reverse.svg" alt="" />
        <span class="brand-name">Fairway Connect</span>
      </a>
      <div class="search-wrap authed-only">
        <input id="searchInput" class="search" type="text" placeholder="Search golfers, courses…" autocomplete="off" />
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <nav class="nav-items authed-only">
        <a href="#/feed" class="nav-item" data-nav="feed"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-6v-6h-4v6H4Z"/></svg></span><span class="nav-label">Home</span></a>
        <a href="#/network" class="nav-item" data-nav="network"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c.5-4 2-6 5-6s4.5 2 5 6M14 15c3-1 5 .5 6 4"/></svg></span><span class="nav-label">Foursome</span><span id="badgeNetwork" class="badge hidden"></span></a>
        <a href="#/teetimes" class="nav-item" data-nav="teetimes"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21V4m1 1 9 3-9 3M4 21h8"/></svg></span><span class="nav-label">Rounds</span></a>
        <a href="#/calendar" class="nav-item" data-nav="calendar"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg></span><span class="nav-label">Calendar</span></a>
        <a href="#/messages" class="nav-item" data-nav="messages"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H8l-4 3Z"/></svg></span><span class="nav-label">Messages</span><span id="badgeMessages" class="badge hidden"></span></a>
        <a href="#/notifications" class="nav-item" data-nav="notifications"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-2-3v-4a4 4 0 0 0-8 0v4Zm4 3h4"/></svg></span><span class="nav-label">Alerts</span><span id="badgeNotifs" class="badge hidden"></span></a>
        <a href="#/profile/me" class="nav-item" data-nav="me"><span class="nav-icon avatar-icon" id="navAvatar"></span><span class="nav-label">Me</span></a>
      </nav>
    </div>
  </header>

  <main id="app" class="page"></main>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
